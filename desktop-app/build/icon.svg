<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b8bff"/>
      <stop offset="1" stop-color="#8a6bff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2550"/>
      <stop offset="1" stop-color="#0c1230"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f76"/>
      <stop offset="0.5" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#38d39a"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="black" opacity="0.06"/>

  <!-- cabinet body (wide, flat top) -->
  <rect x="140" y="150" width="232" height="212" rx="18" fill="#2a3150"/>
  <rect x="140" y="150" width="232" height="212" rx="18" fill="black" opacity="0.10"/>

  <!-- marquee band (lit header) -->
  <rect x="158" y="166" width="196" height="40" rx="10" fill="url(#marquee)"/>

  <!-- screen -->
  <rect x="158" y="218" width="196" height="104" rx="12" fill="url(#screen)"/>
  <rect x="158" y="218" width="196" height="104" rx="12" fill="none" stroke="#3a4a7a" stroke-width="3"/>
  <!-- space invader on screen -->
  <g fill="#8cf3c8">
    <rect x="239" y="244" width="12" height="12"/>
    <rect x="261" y="244" width="12" height="12"/>
    <rect x="228" y="256" width="56" height="12"/>
    <rect x="217" y="268" width="78" height="12"/>
    <rect x="217" y="280" width="14" height="12"/>
    <rect x="281" y="280" width="14" height="12"/>
    <rect x="239" y="280" width="14" height="12"/>
    <rect x="261" y="280" width="14" height="12"/>
  </g>

  <!-- control panel ledge (sticks out wider than the body) -->
  <path d="M120 336 h272 a12 12 0 0 1 12 12 v10 a14 14 0 0 1 -14 14 H122
           a14 14 0 0 1 -14 -14 v-10 a12 12 0 0 1 12 -12 z" fill="#222840"/>
  <!-- joystick -->
  <rect x="169" y="344" width="12" height="20" rx="6" fill="#d9e0ff"/>
  <circle cx="175" cy="344" r="12" fill="#ff5f76"/>
  <!-- buttons -->
  <circle cx="250" cy="356" r="11" fill="#ffd34d"/>
  <circle cx="282" cy="356" r="11" fill="#38d39a"/>
  <circle cx="314" cy="356" r="11" fill="#6b8bff"/>

  <!-- legs -->
  <rect x="150" y="372" width="26" height="22" rx="6" fill="#222840"/>
  <rect x="336" y="372" width="26" height="22" rx="6" fill="#222840"/>
</svg>
